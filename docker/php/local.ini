; ─────────────────────────────────────────────────────────────
; PHP configuration for local Docker development
; ─────────────────────────────────────────────────────────────

; Development defaults
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; Uploads & memory
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120

; Timezone (change to your operator base timezone later if needed)
date.timezone = UTC

; OPcache (optimized for Docker-on-Windows dev)
; validate_timestamps=0 means PHP caches bytecode forever (until container restart)
; This avoids slow stat() calls across the WSL2 VM boundary on EVERY request.
; To pick up PHP file changes: docker compose restart app  (fast — ~2s)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Realpath cache — reduces filesystem stat() calls for autoloading
; Critical for Docker-on-Windows where each stat() crosses the VM boundary
realpath_cache_size = 4096K
realpath_cache_ttl = 600