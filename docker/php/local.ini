; ─────────────────────────────────────────────────────────────
; PHP configuration for local Docker development
; ─────────────────────────────────────────────────────────────

; Development defaults
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; Uploads & memory
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120

; Timezone (change to your operator base timezone later if needed)
date.timezone = UTC

; OPcache (development — no file caching so edits apply immediately)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1