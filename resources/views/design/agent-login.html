<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Login</title>
<!-- BLADE: search "BLADE:" comments. No external assets. -->
<style>
  :root { --brand:#0b6e4f; --brand-dark:#08523b; --bg:#f3f6f5; --card:#fff; --text:#17211d; --muted:#5b6b64; --line:#dbe3df; --danger:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  .box { width:100%; max-width:380px; }
  .logo { text-align:center; margin-bottom:18px; }
  .logo h1 { margin:0; font-size:1.4rem; color:var(--brand-dark); }
  .logo p { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  label { display:block; font-size:.85rem; font-weight:600; margin:14px 0 6px; }
  label:first-of-type { margin-top:0; }
  input { width:100%; padding:13px 12px; font-size:1rem; border:2px solid var(--line); border-radius:10px; }
  input:focus { outline:none; border-color:var(--brand); }
  .err { color:var(--danger); font-size:.82rem; margin:6px 0 0; }
  button { width:100%; margin-top:18px; padding:14px; font-size:1rem; font-weight:700; color:#fff;
           background:var(--brand); border:0; border-radius:10px; cursor:pointer; }
  button:active { background:var(--brand-dark); }
  .links { text-align:center; margin-top:14px; font-size:.85rem; }
  .links a { color:var(--brand-dark); }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <!-- BLADE: {{ config('app.name') }} -->
    <h1>Your WiFi Business Name</h1>
    <p>Agent portal</p>
  </div>

  <!-- BLADE: <form method="POST" action="{{ route('agent.login') }}"> @csrf -->
  <form class="card" onsubmit="location.href='agent-dashboard.html';return false;">
    <label for="phone">Phone number or email</label>
    <input id="phone" name="login" type="text" autocomplete="username" placeholder="07XXXXXXXX">
    <!-- BLADE: @error('login') <p class="err">{{ $message }}</p> @enderror -->

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">

    <button type="submit">Sign in</button>
    <div class="links"><a href="#">Forgot password?</a></div>
  </form>
</div>
</body>
</html>
