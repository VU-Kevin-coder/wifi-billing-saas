[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; Process manager
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Logs to stderr (visible via docker compose logs app)
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no