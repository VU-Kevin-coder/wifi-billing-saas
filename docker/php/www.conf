[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; Process manager — dynamic keeps warm workers ready without wasting RAM
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
; Recycle workers every 500 requests to prevent memory leaks
pm.max_requests = 500

; Slow-log: logs any request taking longer than 2s (visible in docker compose logs app)
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2

; Logs to stderr (visible via docker compose logs app)
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no