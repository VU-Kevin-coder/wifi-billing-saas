; ─────────────────────────────────────────────────────────────
; PHP configuration for local Docker development
; ─────────────────────────────────────────────────────────────

; Development defaults
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

; Uploads & memory
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120

; Timezone (change to your operator base timezone later if needed)
date.timezone = UTC

; OPcache (optimized for Docker-on-Windows dev)
; revalidate_freq=2 means PHP only checks for file changes every 2 seconds
; instead of every single request — massive speedup on Docker volumes
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Realpath cache — reduces filesystem stat() calls for autoloading
; Critical for Docker-on-Windows where each stat() crosses the VM boundary
realpath_cache_size = 4096K
realpath_cache_ttl = 600