# render.yaml — Hamnet Wi-Fi Billing System
# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Topology
#   hamnet-app        web     nginx + php-fpm (runs migrations on boot)
#   hamnet-scheduler  worker  `schedule:work` — session expiry, payment and
#                             withdrawal reconciliation. Must always be running.
#   hamnet-redis      keyvalue sessions, cache, rate limits, scheduler locks
#   hamnet-db         postgres
#
# Before the first deploy:
#   * Fill in the `sync: false` values when Render prompts for them.
#   * Tenant subdomains (https://<tenant>.<TENANT_BASE_DOMAIN>) need a custom
#     wildcard domain; *.onrender.com cannot serve them.
#   * Validate this file:  render blueprints validate render.yaml
#   * Check your database plan's backup retention in the Render dashboard and
#     rehearse a restore before taking real payments.

envVarGroups:
  # APP_KEY must be identical on every service: encrypted columns and platform
  # secrets are unreadable with a different key.
  - name: hamnet-shared
    envVars:
      - key: APP_KEY
        generateValue: true

services:
  - type: web
    name: hamnet-app
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    healthCheckPath: /up
    envVars:
      - fromGroup: hamnet-shared
      - key: APP_NAME
        value: "Hamnet Wi-Fi Billing System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false               # https://your-domain
      - key: TENANT_BASE_DOMAIN
        sync: false               # e.g. wifi.example.com (tenants live at <slug>.<this>)
      - key: TRUSTED_PROXIES
        sync: false               # Set exact trusted proxy IPs/CIDRs; wildcard trust is unsafe.
      - key: LOG_CHANNEL
        value: stderr
      # ── Database ──
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: hamnet-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: hamnet-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: hamnet-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: hamnet-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: hamnet-db, property: password }
      # ── Redis-backed sessions / cache (survive redeploys, shared across instances) ──
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_URL
        fromService: { type: keyvalue, name: hamnet-redis, property: connectionString }
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: sync               # the app dispatches no queued jobs today
      # ── Session / cookie security ──
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      # ── Security policy ──
      - key: PLATFORM_ADMIN_MFA_REQUIRED
        value: "true"
      - key: MFA_STEP_UP_ENABLED
        value: "true"
      - key: SITE_AGENT_REQUIRED
        value: "true"
      # ── Mail (staff invitations and password resets are delivered by email) ──
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

  - type: worker
    name: hamnet-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter
    # Bypasses the web entrypoint: no migrations, no nginx, just the scheduler.
    dockerCommand: /bin/sh -c "/usr/local/bin/preflight.sh worker && php /var/www/html/artisan schedule:work"
    envVars:
      - fromGroup: hamnet-shared
      - key: APP_NAME
        value: "Hamnet Wi-Fi Billing System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: hamnet-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: hamnet-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: hamnet-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: hamnet-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: hamnet-db, property: password }
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_URL
        fromService: { type: keyvalue, name: hamnet-redis, property: connectionString }
      - key: CACHE_STORE
        value: redis              # schedule `withoutOverlapping` locks live here
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Hamnet Wi-Fi Billing System"

  - type: keyvalue
    name: hamnet-redis
    plan: starter
    maxmemoryPolicy: noeviction   # never silently evict sessions or locks
    ipAllowList: []               # internal network only

databases:
  - name: hamnet-db
    plan: basic-256mb
    databaseName: hamnet
    user: hamnet
    ipAllowList: []               # internal only; add your IP temporarily to run psql
