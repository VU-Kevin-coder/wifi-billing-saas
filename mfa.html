<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Confirm it's you · Acme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2eee6;
    --panel: #fbf9f4;
    --field: #fffdf9;
    --ink: #1c1a17;
    --ink-soft: #3d3932;
    --muted: #6f6a60;
    --line: #ddd6c8;
    --accent: #1f5f4a;
    --accent-soft: #e2eee8;
    --bad: #b4372b;
    --bad-soft: #f7e3df;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22, .9, .3, 1);
    /* Want your own photo or texture? Set --bg-image: url("your-file.jpg"); */
    --bg-image: none;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ───────── Background asset ───────── */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 60% at 50% 40%, #f8f5ee 0%, transparent 70%),
      var(--bg-image) center / cover no-repeat,
      var(--paper);
  }
  .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .drift {
    transform-box: fill-box; transform-origin: center;
    animation: drift 90s ease-in-out infinite alternate;
  }
  .drift.b { animation-duration: 120s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(3deg) scale(1.03); } }

  /* ───────── Layout ───────── */
  .shell {
    position: relative; z-index: 1;
    min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px 16px;
  }
  .panel {
    width: 100%; max-width: 440px;
    background: rgba(251, 249, 244, .94);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 30px 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 18px 40px -22px rgba(60, 50, 30, .35);
    animation: rise .7s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
  .wordmark { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 600; font-size: 1.1rem; letter-spacing: -.01em; }
  .wordmark svg { width: 20px; height: 20px; }
  .step { font-size: .76rem; color: var(--muted); letter-spacing: .02em; }

  h1 {
    margin: 0 0 8px;
    font-family: var(--serif); font-weight: 500; font-size: 2rem; line-height: 1.12; letter-spacing: -.025em;
  }
  .lede { margin: 0; color: var(--muted); font-size: .96rem; line-height: 1.55; }
  .lede b { color: var(--ink-soft); font-weight: 600; }
  .swap { animation: swap .38s var(--ease) both; }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .pane { animation: swap .38s var(--ease) both; }

  /* ───────── Code entry ───────── */
  .otp { position: relative; margin: 26px 0 0; }
  .cells { display: flex; gap: 8px; justify-content: center; }
  .cell {
    position: relative; flex: 1; max-width: 54px; aspect-ratio: 54 / 66;
    display: grid; place-items: center;
    background: var(--field);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-family: var(--serif); font-size: 1.85rem; font-weight: 500; color: var(--ink);
    font-variant-numeric: lining-nums tabular-nums;
    transition: border-color .2s, background .3s, color .3s, box-shadow .25s, transform .25s var(--ease);
  }
  .cell:nth-child(4) { margin-left: 12px; }
  .cell.filled { border-color: #b9b09c; }
  .cell.active { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31, 95, 74, .12); transform: translateY(-2px); }
  .cell.active::after {
    content: ""; width: 2px; height: 28px; border-radius: 2px; background: var(--accent);
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .d { display: block; }
  .d.pop { animation: digit .42s var(--ease); }
  @keyframes digit {
    0%   { opacity: 0; transform: translateY(-14px) scale(.6); filter: blur(3px); }
    55%  { opacity: 1; transform: translateY(2px) scale(1.1); filter: blur(0); }
    100% { transform: none; }
  }

  .otp-input {
    position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%;
    opacity: 0; border: 0; font-size: 16px; cursor: text; caret-color: transparent;
  }

  .track { height: 3px; margin-top: 18px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar {
    height: 100%; width: 100%; background: var(--accent);
    transform: scaleX(var(--p, 0)); transform-origin: left;
    transition: transform .35s var(--ease), background .3s;
  }

  /* checking: the cells ripple and a light travels along the track */
  .is-checking .cell { animation: wave .9s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms); border-color: var(--accent); }
  @keyframes wave { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  .is-checking .bar { width: 35%; transform: none; animation: scan 1s ease-in-out infinite; }
  @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  /* success: cells fill in one after another */
  .is-ok .cell {
    background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none;
    transition-delay: calc(var(--i) * 60ms);
    animation: okpop .5s var(--ease) both; animation-delay: calc(var(--i) * 60ms);
  }
  @keyframes okpop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .is-ok .bar { transform: scaleX(1); }

  /* error: shake, tint, then clear */
  .is-bad .cells { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
  @keyframes shake { 15% { transform: translateX(-8px); } 30% { transform: translateX(7px); } 45% { transform: translateX(-5px); } 60% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
  .is-bad .cell { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); box-shadow: none; }
  .is-bad .bar { background: var(--bad); transform: scaleX(1); }

  .status { min-height: 1.5em; margin: 12px 0 0; text-align: center; font-size: .86rem; color: var(--muted); }
  .status.err { color: var(--bad); animation: swap .3s var(--ease); }

  .resend { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 4px; font-size: .86rem; color: var(--muted); }
  .link {
    background: none; border: 0; padding: 0; color: var(--accent); font-size: inherit; font-weight: 600; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: text-decoration-color .2s;
  }
  .link:hover:not(:disabled) { text-decoration-color: currentColor; }
  .link:disabled { color: var(--muted); font-weight: 500; cursor: default; }

  /* ───────── Backup code + passkey ───────── */
  .text-input {
    width: 100%; margin-top: 26px; padding: 15px 16px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 1.15rem; letter-spacing: .14em; text-align: center; text-transform: uppercase;
    color: var(--ink); background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .25s, background .25s;
  }
  .text-input::placeholder { color: #b8b0a0; }
  .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31, 95, 74, .12); }
  .text-input.is-bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .45s; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 14px; padding: 14px 16px;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 12px;
    font-size: .95rem; font-weight: 600; cursor: pointer;
    transition: background .2s, transform .15s var(--ease), opacity .2s;
  }
  .btn:hover:not(:disabled) { background: #000; }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: turn .7s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ───────── Trust + alternatives ───────── */
  .trust { display: flex; align-items: center; gap: 10px; margin-top: 22px; font-size: .88rem; color: var(--ink-soft); cursor: pointer; user-select: none; }
  .trust input { position: absolute; opacity: 0; pointer-events: none; }
  .box { width: 20px; height: 20px; border: 1.5px solid #b9b09c; border-radius: 6px; background: var(--field); display: grid; place-items: center; transition: background .2s, border-color .2s; }
  .box svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset .25s var(--ease); }
  .trust input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .trust input:checked + .box svg { stroke-dashoffset: 0; }
  .trust input:focus-visible + .box { box-shadow: 0 0 0 4px rgba(31, 95, 74, .18); }

  .alt { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
  .alt-h { margin: 0 0 4px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .alt button {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 10px 2px; background: none; border: 0; border-bottom: 1px solid transparent;
    color: var(--ink-soft); font-size: .93rem; cursor: pointer; text-align: left;
  }
  .alt button span.arr { color: var(--muted); transition: transform .25s var(--ease), color .2s; }
  .alt button:hover { color: var(--ink); }
  .alt button:hover span.arr { transform: translateX(4px); color: var(--accent); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; font-size: .82rem; color: var(--muted); }
  .foot .link { color: var(--muted); font-weight: 500; }
  .foot .link:hover { color: var(--ink); }
  .help { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: .84rem; color: var(--ink-soft); line-height: 1.5; animation: swap .3s var(--ease); }
  .help a { color: var(--accent); font-weight: 600; }

  /* ───────── Done ───────── */
  .done { text-align: center; padding: 18px 0 12px; animation: swap .5s var(--ease) both; }
  .big-check { width: 72px; height: 72px; margin: 0 auto 20px; }
  .big-check circle { fill: var(--accent-soft); transform-origin: center; animation: grow .5s var(--ease) both; }
  .big-check path { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .45s .3s var(--ease) forwards; }
  @keyframes grow { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done .track { max-width: 160px; margin: 22px auto 0; }
  .done .bar { transform: scaleX(0); animation: fill 2.4s linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  /* ───────── Toast ───────── */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 5;
    padding: 11px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: .86rem;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    transition: transform .35s var(--ease), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (max-width: 420px) {
    .panel { padding: 22px 20px 18px; }
    h1 { font-size: 1.7rem; }
    .cells { gap: 6px; }
    .cell:nth-child(4) { margin-left: 8px; }
    .cell { font-size: 1.55rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- Background: generated contour map + paper grain (all inline, no image files) -->
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .27  0 0 0 0 .2  0 0 0 .55 0"/>
      </filter>
    </defs>
    <g id="topoA" class="drift"></g>
    <g id="topoB" class="drift b"></g>
    <rect width="1440" height="900" filter="url(#grain)" opacity=".22"/>
  </svg>
</div>

<main class="shell">
  <section class="panel" id="panel">

    <header class="top">
      <div class="wordmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1f5f4a" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
        Acme
      </div>
      <span class="step">Sign-in · step 2 of 2</span>
    </header>

    <div id="verify">
      <h1 id="title" class="swap"></h1>
      <p class="lede swap" id="lede"></p>

      <div id="stage">
        <!-- 6-digit panes (app / sms / email) are cloned from this template -->
        <template id="otpTpl">
          <div class="pane">
            <div class="otp">
              <div class="cells">
                <div class="cell"><span class="d"></span></div><div class="cell"><span class="d"></span></div><div class="cell"><span class="d"></span></div>
                <div class="cell"><span class="d"></span></div><div class="cell"><span class="d"></span></div><div class="cell"><span class="d"></span></div>
              </div>
              <div class="track"><div class="bar"></div></div>
              <input class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="6-digit verification code" pattern="[0-9]*">
            </div>
            <p class="status" role="status" aria-live="polite"></p>
            <div class="resend" hidden>
              <span>Nothing yet?</span>
              <button type="button" class="link resend-btn">Send again</button>
            </div>
          </div>
        </template>

        <div class="pane" id="pane-backup" hidden>
          <input class="text-input" id="backupInput" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" aria-label="Backup code">
          <p class="status" id="backupStatus" role="status" aria-live="polite"></p>
          <button class="btn" id="backupBtn" type="button" disabled>Verify code</button>
        </div>

        <div class="pane" id="pane-passkey" hidden>
          <button class="btn" id="passkeyBtn" type="button" style="margin-top:26px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
            <span id="passkeyLabel">Continue with passkey</span>
          </button>
          <p class="status" id="passkeyStatus" role="status" aria-live="polite"></p>
        </div>
      </div>

      <label class="trust">
        <input type="checkbox" id="trust">
        <span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span>
        Remember this device for 30 days
      </label>

      <nav class="alt" aria-label="Other ways to verify">
        <p class="alt-h">Or verify another way</p>
        <div id="altList"></div>
      </nav>
    </div>

    <div class="done" id="done" hidden>
      <svg class="big-check" viewBox="0 0 72 72" aria-hidden="true">
        <circle cx="36" cy="36" r="34"/>
        <path d="M23 37l9 9 17-19" pathLength="26"/>
      </svg>
      <h1>You're in</h1>
      <p class="lede">Verified. Taking you to your dashboard.</p>
      <div class="track"><div class="bar"></div></div>
    </div>

    <footer class="foot">
      <button class="link" type="button" id="helpBtn">Need help?</button>
      <button class="link" type="button" id="signOut">Sign out</button>
    </footer>
    <p class="help" id="helpBox" hidden>Email <a href="mailto:support@acme.com">support@acme.com</a> and we'll get you back in.</p>

  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* ═════════ Background: contour lines ═════════ */
  (function topo() {
    const NS = 'http://www.w3.org/2000/svg';
    const clusters = [
      { g: '#topoA', cx: 1180, cy: 270, n: 16,
        d: 'M1180 140 C1260 128 1352 190 1362 282 C1372 374 1290 436 1198 446 C1106 456 1012 404 996 312 C980 220 1100 152 1180 140 Z' },
      { g: '#topoB', cx: 230, cy: 720, n: 14,
        d: 'M230 590 C320 570 412 640 408 732 C404 824 312 874 226 864 C140 854 66 794 70 714 C74 634 150 606 230 590 Z' }
    ];
    clusters.forEach(c => {
      const g = $(c.g);
      for (let k = 0; k < c.n; k++) {
        const p = document.createElementNS(NS, 'path');
        const s = 0.14 + k * 0.125;
        p.setAttribute('d', c.d);
        p.setAttribute('transform', `translate(${c.cx} ${c.cy}) rotate(${k * 3.2}) scale(${s}) translate(${-c.cx} ${-c.cy})`);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', '#1f5f4a');
        p.setAttribute('stroke-width', k % 4 === 0 ? '1.6' : '1');
        p.setAttribute('stroke-opacity', (0.28 - (k / c.n) * 0.2).toFixed(3));
        p.setAttribute('vector-effect', 'non-scaling-stroke');
        g.appendChild(p);
      }
    });
  })();

  /* ═════════ Config (swap with real values from your server) ═════════ */
  const CONFIG = {
    maskedPhone: '+256 7•• ••• 482',
    maskedEmail: 'k•••@example.com',
    resendSeconds: 30
  };

  const METHODS = {
    totp:    { label: 'Authenticator app', title: 'Enter your code',      lede: () => 'Open your authenticator app and type the 6-digit code shown for <b>Acme</b>.' },
    sms:     { label: 'Text message',      title: 'Check your phone',     lede: () => `We texted a 6-digit code to <b>${CONFIG.maskedPhone}</b>.` },
    email:   { label: 'Email',             title: 'Check your inbox',     lede: () => `We emailed a 6-digit code to <b>${CONFIG.maskedEmail}</b>.` },
    backup:  { label: 'Backup code',       title: 'Use a backup code',    lede: () => 'Type one of the recovery codes you saved when you set up two-step verification. Each one works once.' },
    passkey: { label: 'Passkey',           title: 'Use your passkey',     lede: () => 'Your device will ask for your fingerprint, face or screen lock. Only a signed proof leaves your device.' }
  };
  const ORDER = ['totp', 'sms', 'email', 'backup', 'passkey'];

  /* ═════════ API stubs: replace with real calls ═════════ */
  const api = {
    async verify(method, code) {
      // const res = await fetch('/api/mfa/verify', { method: 'POST', headers: {'Content-Type':'application/json'},
      //   body: JSON.stringify({ method, code, trust: $('#trust').checked }) });
      // if (!res.ok) throw new Error((await res.json()).message || 'Wrong code');
      await sleep(1100);
      if (code === '000000' || code === '0000-0000-0000') throw new Error(method === 'backup' ? 'That backup code was already used.' : "That code didn't match. Try again.");
    },
    async send(method) { await sleep(500); /* fetch('/api/mfa/send', ...) */ },
    async passkey() { await sleep(1400); /* WebAuthn: navigator.credentials.get(...) */ }
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ═════════ Helpers ═════════ */
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function retrigger(el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }

  function onSuccess() {
    $('#verify').hidden = true;
    $('#done').hidden = false;
    // setTimeout(() => (window.location.href = '/dashboard'), 2600);
  }

  /* ═════════ 6-digit panes ═════════ */
  const otps = {};
  const cooldowns = {};
  const sent = {};

  function buildOtp(method) {
    const pane = $('#otpTpl').content.firstElementChild.cloneNode(true);
    pane.id = 'pane-' + method;
    pane.hidden = true;
    $('#stage').appendChild(pane);

    const otp = $('.otp', pane), input = $('.otp-input', pane), cells = $$('.cell', pane),
          status = $('.status', pane), resend = $('.resend', pane), resendBtn = $('.resend-btn', pane);
    let busy = false;
    cells.forEach((c, i) => c.style.setProperty('--i', i));

    const render = () => {
      const v = input.value;
      cells.forEach((c, i) => {
        const d = $('.d', c), ch = v[i] || '';
        if (d.textContent !== ch) {
          d.textContent = ch;
          c.classList.toggle('filled', !!ch);
          if (ch) { d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }
        }
        c.classList.toggle('active', document.activeElement === input && v.length < 6 && i === v.length);
      });
      otp.style.setProperty('--p', v.length / 6);
    };
    const toEnd = () => { const n = input.value.length; try { input.setSelectionRange(n, n); } catch (e) {} };

    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 6);
      status.textContent = ''; status.classList.remove('err');
      render();
      if (input.value.length === 6) setTimeout(submit, 280); // let the last digit land first
    });
    input.addEventListener('focus', () => { render(); toEnd(); });
    input.addEventListener('blur', render);
    input.addEventListener('click', toEnd);
    input.addEventListener('keydown', e => { if (e.key.startsWith('Arrow') || e.key === 'Home') e.preventDefault(); });
    $('.cells', pane).addEventListener('click', () => input.focus());

    async function submit() {
      if (busy || input.value.length < 6) return;
      busy = true; input.readOnly = true;
      otp.classList.add('is-checking');
      try {
        await api.verify(method, input.value);
        otp.classList.remove('is-checking'); otp.classList.add('is-ok');
        await sleep(1000);
        onSuccess();
      } catch (err) {
        otp.classList.remove('is-checking'); otp.classList.add('is-bad');
        status.textContent = err.message || "That code didn't match. Try again.";
        status.classList.add('err');
        await sleep(750);
        otp.classList.remove('is-bad');
        input.value = ''; input.readOnly = false; busy = false;
        render(); input.focus();
      }
    }

    // resend (sms + email only)
    if (method === 'totp') resend.remove();
    else {
      resend.hidden = false;
      resendBtn.addEventListener('click', async () => {
        if (cooldowns[method] > 0) return;
        await api.send(method);
        toast('New code on its way');
        startCooldown(method);
      });
    }

    otps[method] = { pane, input, render, resendBtn };
  }

  function startCooldown(method) {
    const o = otps[method]; if (!o || !o.resendBtn.isConnected) return;
    cooldowns[method] = CONFIG.resendSeconds;
    clearInterval(startCooldown[method]);
    const tick = () => {
      if (cooldowns[method] > 0) { o.resendBtn.disabled = true; o.resendBtn.textContent = `Send again in ${cooldowns[method]}s`; }
      else { o.resendBtn.disabled = false; o.resendBtn.textContent = 'Send again'; clearInterval(startCooldown[method]); }
    };
    tick();
    startCooldown[method] = setInterval(() => { cooldowns[method]--; tick(); }, 1000);
  }

  /* ═════════ Backup code ═════════ */
  const bInput = $('#backupInput'), bBtn = $('#backupBtn'), bStatus = $('#backupStatus');
  bInput.addEventListener('input', () => {
    const v = bInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 12);
    bInput.value = (v.match(/.{1,4}/g) || []).join('-');
    bInput.classList.remove('is-bad'); bStatus.textContent = ''; bStatus.classList.remove('err');
    bBtn.disabled = v.length !== 12;
  });
  $('#pane-backup').addEventListener('keydown', e => { if (e.key === 'Enter' && !bBtn.disabled) bBtn.click(); });
  bBtn.addEventListener('click', async () => {
    bBtn.disabled = true; bBtn.innerHTML = '<span class="spin"></span> Checking';
    try {
      await api.verify('backup', bInput.value);
      onSuccess();
    } catch (err) {
      bInput.classList.add('is-bad');
      bStatus.textContent = err.message; bStatus.classList.add('err');
      bBtn.textContent = 'Verify code'; bBtn.disabled = false;
    }
  });

  /* ═════════ Passkey ═════════ */
  const pBtn = $('#passkeyBtn'), pStatus = $('#passkeyStatus');
  if (!window.PublicKeyCredential) {
    pBtn.disabled = true;
    pStatus.textContent = "This browser doesn't support passkeys. Pick another method below.";
    pStatus.classList.add('err');
  }
  pBtn.addEventListener('click', async () => {
    pBtn.disabled = true; $('#passkeyLabel').textContent = 'Waiting for your device…';
    pStatus.textContent = ''; pStatus.classList.remove('err');
    try { await api.passkey(); onSuccess(); }
    catch (err) {
      if (err && err.name === 'NotAllowedError') { pStatus.textContent = 'Cancelled. Tap to try again.'; }
      else { pStatus.textContent = 'Passkey failed. Try again or use another method.'; pStatus.classList.add('err'); }
      pBtn.disabled = false; $('#passkeyLabel').textContent = 'Continue with passkey';
    }
  });

  /* ═════════ Method switching ═════════ */
  let current = null;

  function show(id) {
    current = id;
    const m = METHODS[id];
    $('#title').textContent = m.title;
    $('#lede').innerHTML = m.lede();
    retrigger($('#title')); retrigger($('#lede'));

    ORDER.forEach(k => { const p = $('#pane-' + k); if (p) p.hidden = k !== id; });
    const pane = $('#pane-' + id);
    pane.classList.remove('pane'); void pane.offsetWidth; pane.classList.add('pane');

    $('#altList').innerHTML = '';
    ORDER.filter(k => k !== id).forEach(k => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<span>${METHODS[k].label}</span><span class="arr">→</span>`;
      b.addEventListener('click', () => show(k));
      $('#altList').appendChild(b);
    });

    if (otps[id]) {
      if ((id === 'sms' || id === 'email') && !sent[id]) { sent[id] = true; api.send(id); startCooldown(id); }
      otps[id].input.focus();
    } else if (id === 'backup') bInput.focus();
  }

  ['totp', 'sms', 'email'].forEach(buildOtp);

  /* ═════════ Footer ═════════ */
  $('#helpBtn').addEventListener('click', () => { const h = $('#helpBox'); h.hidden = !h.hidden; });
  let armed = false, armTimer;
  $('#signOut').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!armed) {
      armed = true; b.textContent = 'Tap again to sign out';
      armTimer = setTimeout(() => { armed = false; b.textContent = 'Sign out'; }, 3000);
    } else {
      clearTimeout(armTimer);
      // await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  });

  show('totp');
})();
</script>
</body>
</html>
