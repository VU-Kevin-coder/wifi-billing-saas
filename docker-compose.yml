services:
  # ─────────────────────────────────────────────────────────
  # Laravel app (PHP-FPM)
  # ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wifi-billing-saas-app:dev
    container_name: wifi-billing-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
    environment:
      # Override any .env values that must match Docker service names
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wifi_billing}
      DB_USERNAME: ${DB_USERNAME:-wifi_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_local_env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_redis_password_change_me}
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wifi-net

  # ─────────────────────────────────────────────────────────
  # Laravel scheduler (session expiry and payment reconciliation)
  # ─────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: wifi-billing-saas-app:dev
    container_name: wifi-billing-scheduler
    restart: unless-stopped
    entrypoint: ["php"]
    command: ["artisan", "schedule:work"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wifi_billing}
      DB_USERNAME: ${DB_USERNAME:-wifi_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_local_env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_redis_password_change_me}
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wifi-net

  # ─────────────────────────────────────────────────────────
  # Nginx web server
  # ─────────────────────────────────────────────────────────
  web:
    image: nginx:1.27-alpine
    container_name: wifi-billing-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wifi-net

  # ─────────────────────────────────────────────────────────
  # MySQL 8
  # ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: wifi-billing-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wifi_billing}
      MYSQL_USER: ${DB_USERNAME:-wifi_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_in_local_env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wifi-net

  # ─────────────────────────────────────────────────────────
  # Redis 7 (cache + queue)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wifi-billing-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_dev_redis_password_change_me}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wifi-net

  # ─────────────────────────────────────────────────────────
  # MikroTik CHR (RouterOS) container for testing
  # ─────────────────────────────────────────────────────────
  mikrotik-chr:
    image: evilfreelancer/docker-routeros:latest
    container_name: hamnet-chr
    ports:
      - "127.0.0.1:8728:8728"   # RouterOS API
      - "127.0.0.1:2222:22"     # SSH (optional, for manual testing)
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
    networks:
      - wifi-net   # <-- THIS IS THE CRUCIAL FIX

# ─────────────────────────────────────────────────────────────
# Volumes (persist across container restarts)
# ─────────────────────────────────────────────────────────────
volumes:
  db-data:
  redis-data:

# ─────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────
networks:
  wifi-net:
    driver: bridge